name: MetroTimer
options:
  bundleIdPrefix: com.metrotimer
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

targets:
  MetroTimer:
    type: application
    platform: macOS
    sources:
      - path: Sources/MetroTimer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.metrotimer.app
        PRODUCT_NAME: MetroTimer
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: MetroTimer.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: MetroTimer.entitlements
