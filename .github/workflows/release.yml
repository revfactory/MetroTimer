name: Build & Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
      changelog: ${{ steps.tag.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: v

  build:
    needs: version
    if: needs.version.outputs.new_tag
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Build Release
        run: swift build -c release

      - name: Create .app bundle
        run: |
          mkdir -p MetroTimer.app/Contents/{MacOS,Resources}
          cp .build/release/MetroTimer MetroTimer.app/Contents/MacOS/
          cp Info.plist MetroTimer.app/Contents/
          chmod +x MetroTimer.app/Contents/MacOS/MetroTimer

      - name: Zip app
        run: zip -r MetroTimer-${{ needs.version.outputs.new_tag }}.zip MetroTimer.app

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.new_tag }}
          name: MetroTimer ${{ needs.version.outputs.new_tag }}
          body: ${{ needs.version.outputs.changelog }}
          files: MetroTimer-${{ needs.version.outputs.new_tag }}.zip
